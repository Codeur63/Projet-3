name: FinaScore CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: '7'    

      - name: Check project structure
        run: |
          test -d Projet-3/api
          test -d Projet-3/tests
          test -d Projet-3/models
          test -f Projet-3/api/main.py
          test -f Projet-3/api/model_loader.py
          test -f Projet-3/tests/test_api.py
          test -f Projet-3/models/optuna/optuna_xgboost.pkl

      - name: Run API tests
        run: |
          pytest tests/test_api.py -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: Projet-3
        run: |
          docker build -t finascore-api:test .      