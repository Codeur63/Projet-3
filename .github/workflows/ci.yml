name: FinaScore CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - main  

jobs:
  lint:
    name: Lint code base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ruff

      - name: Check linting
        run: ruff check api/ tests/ 

  test-api:
    runs-on: ubuntu-latest
    needs: lint 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest-cov

      - name: Start Redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: '7'    

      - name: Check project structure
        run: |
          echo "Vérification des répertoires..."

      - name: Run API tests
        env:
          REDIS_URL: redis://localhost:6379
        run: |
          pytest tests/test_api.py -v --cov=api --cov-report=term-missing --cov-fail-under=70 

  docker-build:
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t finascore-api:test . 

      - name: Smoke test du conteneur
        run: |
          docker run -d -p 8000:8000 --name test-container finascore-api:test
          sleep 5
          curl --fail http://localhost:8000/health || (docker logs test-container && exit 1)
          docker stop test-container         