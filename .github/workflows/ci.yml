name: FinaScore CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check project structure
        run: |
          test -d api
          test -d tests
          test -d models
          test -f api/main.py
          test -f api/model_loader.py
          test -f tests/test_api.py
          test -f models/optuna/optuna_xgboost.pkl

      - name: Run API tests
        run: |
          pytest tests/test_api.py -v

  docker-build:
    runs-on: ubuntu-latest
    needs: api-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t finascore-api:test .      