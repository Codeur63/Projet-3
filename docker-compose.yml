services:
  finascore-api:
    build:
      context: .
      dockerfile: DockerFile
    container_name: finascore-api
    ports:
      - "8000:8000"
    environment:
      - ENV=staging
      - REDIS_URL=redis://redis:6379/
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: finascore-redis
    ports:
      - "6379:6379"
    restart: unless-stopped